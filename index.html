<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text-to-Speech Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <main class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden ring-1 ring-gray-900/5">
        <div class="px-6 py-8 sm:p-10">
            <div class="mb-8 text-center">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Suara AI Nusantara</h1>
                <p class="text-gray-500 text-sm">Ubah teks menjadi suara dengan berbagai karakter dan emosi dalam Bahasa Indonesia.</p>
            </div>

            <!-- Pesan Error -->
            <div id="error-message" class="hidden mb-6 p-4 rounded-lg bg-red-50 text-red-700 text-sm border border-red-200">
                <!-- Pesan error dinamis akan muncul di sini -->
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <!-- Pilihan Bahasa -->
                <div>
                    <label for="language" class="block text-sm font-medium text-gray-700 mb-2">Bahasa</label>
                    <select id="language" disabled class="w-full bg-gray-100 border border-gray-300 text-gray-700 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 cursor-not-allowed">
                        <option value="id-ID" selected>🇮🇩 Bahasa Indonesia</option>
                    </select>
                </div>

                <!-- Pilihan Karakter Suara -->
                <div>
                    <label for="voice-model" class="block text-sm font-medium text-gray-700 mb-2">Karakter Suara (Aktor)</label>
                    <select id="voice-model" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 shadow-sm transition-colors cursor-pointer hover:border-gray-400">
                        <optgroup label="👨 Suara Pria">
                            <option value="Orus">Orus (Tegas & Berwibawa)</option>
                            <option value="Charon">Charon (Informatif & Tenang)</option>
                            <option value="Fenrir">Fenrir (Bersemangat & Lantang)</option>
                            <option value="Iapetus">Iapetus (Jelas & Terstruktur)</option>
                            <option value="Algenib">Algenib (Berat & Serak)</option>
                            <option value="Rasalgethi">Rasalgethi (Dewasa & Menenangkan)</option>
                        </optgroup>
                        <optgroup label="👩 Suara Wanita">
                            <option value="Aoede">Aoede (Santai & Mengalir)</option>
                            <option value="Kore">Kore (Tegas & Jelas)</option>
                            <option value="Leda">Leda (Muda & Energik)</option>
                            <option value="Vindemiatrix">Vindemiatrix (Lembut & Ramah)</option>
                            <option value="Despina">Despina (Halus & Elegan)</option>
                            <option value="Laomedeia">Laomedeia (Ceria & Upbeat)</option>
                            <option value="Pulcherrima">Pulcherrima (Lugas & Percaya Diri)</option>
                        </optgroup>
                        <optgroup label="🌟 Suara Karakter Unik">
                            <option value="Zephyr">Zephyr (Cerah & Dinamis)</option>
                            <option value="Puck">Puck (Riang & Unik)</option>
                            <option value="Enceladus">Enceladus (Misterius & Berbisik)</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Pilihan Emosi/Vibe -->
                <div>
                    <label for="emotion" class="block text-sm font-medium text-gray-700 mb-2">Emosi & Gaya (Vibe)</label>
                    <select id="emotion" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 shadow-sm transition-colors cursor-pointer hover:border-gray-400">
                        <option value="netral">😐 Netral (Biasa)</option>
                        <option value="ceria dan semangat">😄 Ceria & Semangat</option>
                        <option value="sedih dan emosional">😢 Sedih & Emosional</option>
                        <option value="puitis dan dramatis">🎭 Puitis & Dramatis</option>
                        <option value="misterius dan berbisik">🕵️ Misterius</option>
                    </select>
                </div>
            </div>

            <div class="mb-6">
                <label for="narration" class="block text-sm font-medium text-gray-700 mb-2">Teks Narasi (Tanpa batas karakter)</label>
                <textarea id="narration" rows="6" placeholder="Ketikkan teks narasi yang ingin Anda ubah menjadi suara di sini..." class="w-full bg-white border border-gray-300 text-gray-900 text-base rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-4 shadow-sm transition-colors resize-y placeholder-gray-400"></textarea>
            </div>

            <button id="generate-btn" class="w-full sm:w-auto inline-flex justify-center items-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 shadow-md transition-all">
                <span id="btn-text">Hasilkan Suara AI</span>
                <div id="btn-loader" class="loader ml-3 hidden"></div>
            </button>

            <!-- Area Output Audio -->
            <div id="output-section" class="hidden mt-10 pt-8 border-t border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Hasil Audio:</h3>
                
                <!-- Visualizer Canvas untuk Video -->
                <canvas id="visualizer" width="1280" height="720" class="w-full h-auto bg-gray-900 rounded-xl mb-4 hidden shadow-inner"></canvas>
                <div id="recording-status" class="hidden mb-4 text-center text-sm font-medium text-indigo-600 animate-pulse">
                    Sedang merender video MP4... (Harap tunggu hingga proses sesuai durasi audio selesai)
                </div>

                <div class="bg-blue-50 p-6 rounded-xl border border-blue-100 flex flex-col lg:flex-row items-center justify-between gap-4">
                    <audio id="audio-player" controls class="w-full lg:max-w-md bg-white rounded-full shadow-sm"></audio>
                    <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                        <a id="download-btn" href="#" download="suara-ai.mp3" class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white font-medium rounded-lg transition-colors shadow-sm">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            Unduh MP3
                        </a>
                        <button id="download-mp4-btn" class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors shadow-sm">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Buat Video (MP4)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
